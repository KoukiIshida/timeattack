<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>短時間タイムアタック</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#101826; --panel:#1b2638; --panel2:#26344c; --text:#f2f6ff; --muted:#9fb0c8;
  --accent:#ffc83d; --danger:#e5484d; --ok:#3ccf7a; --blue:#2f7de1;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent}
img{max-width:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;background:#3a4a66;color:#fff;font-weight:700}
button:hover{filter:brightness(1.1)}
button.primary{background:var(--accent);color:#1a1a1a}
button.blue{background:var(--blue)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #4a5d7e;color:var(--text)}
button.small{padding:6px 12px;font-size:13px;border-radius:8px}
button.big{font-size:22px;padding:16px 36px}
button:disabled,button.done{background:#44494f !important;color:#9a9ca0 !important;cursor:not-allowed;filter:none}
/* Enterで押されるボタンの印 */
#app [data-enter]:not([disabled]){position:relative;outline:3px solid #ffd166;outline-offset:3px;animation:enterGlow 1.6s ease-in-out infinite}
#app [data-enter]:not([disabled])::after{content:'⏎ Enter';position:absolute;top:-12px;right:-10px;background:#ffd166;color:#1a1a1a;font-size:11px;font-weight:900;border-radius:6px;padding:1px 6px}
@keyframes enterGlow{0%,100%{box-shadow:0 0 0 rgba(255,209,102,0)}50%{box-shadow:0 0 18px rgba(255,209,102,.8)}}
input[type=text],input[type=number],textarea,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #4a5d7e;background:#0b111c;color:var(--text)}
input[type=text],textarea{width:100%}
input[type=number]{width:90px;text-align:right}
h1,h2,h3{margin:0 0 12px}
.muted{color:var(--muted)}
.page{max-width:1100px;margin:0 auto;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}

.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.topbar .title{font-size:22px;font-weight:900;letter-spacing:.05em;margin-right:6px}
.round-label{background:var(--accent);color:#1a1a1a;border-radius:8px;padding:3px 12px;font-weight:900}
.round-label.practice{background:#7a4dd8;color:#fff}

.lobby{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 0}
.qrbox{display:inline-block;background:#fff;padding:14px;border-radius:12px;line-height:0}
.url{word-break:break-all;font-size:14px;color:var(--muted);margin-top:8px}
.plist{display:flex;flex-direction:column;gap:8px;min-width:280px;max-height:420px;overflow:auto}
.pitem{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#666;display:inline-block}
.dot.on{background:var(--ok)}
.stage{text-align:center;padding:10px 0}
.stage h2{font-size:30px}
.genre-big{font-size:64px;font-weight:900;color:var(--accent);margin:10px 0 6px;line-height:1.2}
.genre-sub{font-size:22px;font-weight:800;color:var(--muted)}
.timer{font-size:120px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0}
.timer .unit{font-size:34px;margin-left:6px}
.timer.zero{color:var(--danger)}
.timer-label{font-size:22px;font-weight:800;color:var(--muted)}
.btnbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}

/* 正解発表（一覧） */
.ans-table{width:100%;border-collapse:collapse;font-size:20px}
.ans-table td{padding:8px 10px;border-bottom:1px solid #34445f;vertical-align:middle;text-align:left}
.ans-table .no{width:56px;font-weight:900;color:var(--muted);text-align:center}
.ans-table .ans{width:34%;}
.ans-pill{display:inline-block;background:#fff;color:#c92a2a;border-radius:8px;padding:3px 12px;font-weight:900}
.ans-table .supp{font-size:14px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.ans-table img{max-height:56px;border-radius:4px;margin:2px 4px 0 0;cursor:zoom-in}

/* 順位 */
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:7px 10px;border-bottom:1px solid #34445f;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-weight:800;font-size:13px;white-space:nowrap}
.tag.ng{background:#3a4a66;color:#ddd}
.tag.practice{background:#7a4dd8;color:#fff}
.rest-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:10px 0 16px}
.rest-item{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:20px;font-weight:800;display:flex;gap:10px;align-items:center}
.rest-item .rk{color:var(--muted);min-width:52px}
.rest-item .sc{margin-left:auto;color:var(--accent)}
.podium{display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:10px 0 18px}
.pod{background:var(--panel2);border-radius:14px;padding:14px 20px;min-width:210px;text-align:center}
.pod .rk{font-size:26px;font-weight:900}
.pod .nm{font-size:30px;font-weight:900}
.pod .sc{font-size:26px;font-weight:900;color:var(--accent)}
.pod.r1{background:linear-gradient(135deg,#8a6a10,#e8c040);color:#1a1a1a;padding:24px 30px}
.pod.r1 .sc{color:#5a1a00}
.pod.r1 .nm{font-size:40px}
.pod.r2{background:linear-gradient(135deg,#6a7078,#c8d0d8);color:#1a1a1a}
.pod.r3{background:linear-gradient(135deg,#6a3a1a,#c8803a);color:#1a1a1a}
.pod.r2 .sc,.pod.r3 .sc{color:#3a1a00}
.pod.hidden{background:#26344c;color:#6f80a0}
.pod.hidden .nm,.pod.hidden .sc{color:#6f80a0}
.pod.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

.rule-display{text-align:left;max-width:1100px;margin:20px auto 28px;line-height:1.7;font-size:22px}
.rule-red{color:#c0392b;background:#f0f0f0;border:1px solid #ddd;padding:1px 7px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rule-normal{color:#222}
.rule-display, .rule-display *{color:#fff !important}
.rule-display *:not(.rule-red){background-color:transparent !important}
.rule-display .rule-red, .rule-display .rule-red *{color:#e5342b !important}
.rule-display .rule-red{background:#fff !important;border:none}
.rule-display [style*="font-size"]:not([style*="1.5em"]), .rule-display font[size]{font-size:inherit !important}
.rule-display h1, .rule-display h2, .rule-display h3, .rule-display h4, .rule-display p{font-size:inherit !important;margin:0;font-weight:inherit}
.rule-img{border-radius:8px;margin-bottom:10px;cursor:zoom-in;max-height:50vh}

/* 参加者（スマホ） */
body.sub .page{max-width:520px;padding:10px}
.sub-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:8px}
.p-center{text-align:center;padding:30px 12px}
.p-big{font-size:56px;font-weight:900;color:var(--accent);line-height:1.1}
.p-timer{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0 6px}
.p-timer.warn,.p-timer.zero{color:var(--danger)}
.p-qno{text-align:center;font-weight:900;font-size:18px;color:var(--muted)}
.p-qno b{font-size:30px;color:var(--accent)}
.p-qtext{background:var(--panel);border-radius:12px;padding:14px;font-size:21px;font-weight:800;line-height:1.5;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.q-imgs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.q-imgs img{max-height:30vh;border-radius:8px;cursor:zoom-in}
.sub-btns{display:flex;gap:8px;margin-top:10px}
.sub-btns button{padding:14px;font-size:18px}
.sub-btns .send{flex:2}
.sub-btns .pass{flex:1}
.judge{min-height:28px;text-align:center;font-weight:900;font-size:18px;margin-top:8px}
.judge.ng{color:#ff8a8e}
.judge.ok{color:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.spinner{width:40px;height:40px;border:4px solid #3a4a66;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* モーダル・トースト */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;color:#1d1d1f;border-radius:14px;padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal button{background:#e3e6ec;color:#1d1d1f}
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:150}
.img-modal img{max-width:92vw;max-height:92vh}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:200;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#26344c;color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);text-align:center}

.save-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300}
.save-overlay.active{display:flex}
.save-box{background:#fff;color:#222;padding:24px 30px;border-radius:12px;text-align:center;min-width:260px}
.save-box .spinner{border-color:#ddd;border-top-color:#e0a800}
.save-bar-outer{background:#eee;border-radius:6px;height:10px;margin-top:10px;overflow:hidden}
.save-bar-inner{background:#e0a800;height:100%;width:0%;transition:width .2s}

/* 管理 */
.set-grid{display:grid;grid-template-columns:220px 1fr;gap:12px 16px;align-items:center}
.set-grid>.lbl{font-weight:800}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0;z-index:5;border-top:1px solid #34445f}
.rich-toolbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.rich-toolbar button{padding:4px 10px;font-size:13px;border-radius:6px}
.rule-edit{border:1px solid #ccc;border-radius:6px;min-height:70px;padding:10px;background:#fff;color:#222;text-align:left;line-height:1.6}
.rule-slide-card{border:1px solid #34445f;border-radius:10px;padding:10px;margin-bottom:10px;background:#152033}
.rule-group-block{margin-bottom:10px}
.thumb{max-width:120px;max-height:90px;display:block;border-radius:6px;cursor:zoom-in}
.g-block{border:1px solid #34445f;border-radius:10px;margin-bottom:10px;background:#152033;overflow:hidden}
.g-block.dragging{opacity:.4}
.g-block.drag-over{border:2px dashed var(--accent)}
.g-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1f2d45;cursor:pointer;flex-wrap:wrap}
.g-head .g-title{flex:1;font-weight:800;min-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-drag{cursor:grab;font-size:20px;padding:0 4px;user-select:none;color:var(--muted)}
.hchk{display:inline-flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap;cursor:pointer;background:#0b111c;border-radius:6px;padding:3px 8px}
.g-body{display:none;padding:12px 14px}
.g-body.open{display:block}
.fl{font-weight:800;display:block;margin:10px 0 4px}
.q-row{display:grid;grid-template-columns:44px 1fr;gap:8px;border-top:1px solid #2b3a55;padding:10px 0}
.q-row .qn{font-weight:900;font-size:18px;color:var(--accent);text-align:center;padding-top:6px}
.q-row .qf{display:grid;grid-template-columns:2fr 1.3fr 1fr;gap:6px}
.q-row .qf2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.q-row .qf2 input[type=text]{flex:1;min-width:200px;width:auto}
.img-chip{position:relative;display:inline-block}
.img-chip button{position:absolute;top:-6px;right:-6px;padding:0 6px;font-size:12px;border-radius:50%;background:var(--danger)}
.confirm-row{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid #34445f;flex-wrap:wrap}
.err-text{color:#ff8a8e;font-weight:700;font-size:14px}
@media (max-width:800px){ .set-grid{grid-template-columns:1fr} .q-row .qf{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div class="save-overlay" id="save-overlay"><div class="save-box"><div class="spinner"></div><div id="save-msg">保存中…</div>
  <div style="font-size:22px;font-weight:900" id="save-pct">0%</div><div class="save-bar-outer"><div class="save-bar-inner" id="save-bar"></div></div></div></div>

<script>
/* =========================================================
   短時間タイムアタック
   ・パラメータなし     … ホスト画面（PC：QR表示・ルール説明・ジャンル発表・正解発表・結果発表）
   ・?room=XXXX        … 参加者画面（スマホ：ジャンルの問題を1問目から順に解答／パス）
   ・?mode=admin       … 管理ページ（メモ・制限時間・ルール説明・ジャンルと問題の登録・CSV取り込み）
   ルール：1ジャンル12問。正解すると次の問題へ（誤答ペナルティなし・何度でも答え直せる）。
          パスで次の問題へ（戻れない）。最後の問題を正解orパスで終了。1問正解＝1点。
          結果発表まで得点は誰にも（本人にも）見せない。
   ========================================================= */
const GAME_TITLE='短時間タイムアタック';
const ROOM_PREFIX='tta-';
const Q_PER_GENRE=12;

const LS={ state:'tta_host_state', room:'tta_room' };
const SS_PID='tta_pid', SS_NAME='tta_name';
const DB_NAME='tantimeattack', STORE='kv', DATA_KEY='appData';

const params=new URLSearchParams(location.search);
const MODE=params.get('mode')==='admin' ? 'admin' : (params.get('room') ? 'sub' : 'host');
document.body.classList.add(MODE);

/* ---------- 共通ユーティリティ ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lsGet(k, def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ alert('ブラウザへの保存に失敗しました'); } }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function stripHtml(h){ return String(h||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim(); }
function toInt(v){ const s=String(v==null?'':v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim(); return /^-?\d+$/.test(s) ? parseInt(s,10) : NaN; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function openModal(html, buttons){
  const wrap=document.createElement('div');
  wrap.className='modal-bg';
  wrap.innerHTML=`<div class="modal">${html}<div class="modal-btns"></div></div>`;
  const close=()=>wrap.remove();
  (buttons||[{label:'閉じる'}]).forEach(b=>{
    const el=document.createElement('button');
    el.textContent=b.label; if(b.cls) el.className=b.cls;
    el.onclick=()=>{ if(b.onClick && b.onClick()===false) return; close(); };
    wrap.querySelector('.modal-btns').appendChild(el);
  });
  document.getElementById('modal-root').appendChild(wrap);
  return {el:wrap, close};
}
function showToast(text, ms){
  const el=document.createElement('div'); el.className='toast'; el.textContent=text;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(), ms||2400);
}
document.addEventListener('click', e=>{
  if(e.target.tagName==='IMG' && e.target.closest('.rule-img,.thumb,.q-imgs,.ans-table')){
    const m=document.createElement('div'); m.className='img-modal';
    m.innerHTML=`<img src="${e.target.src}">`; m.onclick=()=>m.remove();
    document.body.appendChild(m);
  }
});

/* スリープ防止 */
let wakeLock=null;
async function requestWakeLock(){ try{ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !wakeLock && MODE!=='admin') requestWakeLock(); });

/* ---------- 管理データ ---------- */
const DEFAULT_RULE_SLIDES=[{img:null, groups:[
  'ジャンルごとに<b>12問</b>の問題に挑戦します。制限時間は<span class="rule-red">{制限秒}秒</span>！',
  'スマホに1問目が出ます。<b>正解すると次の問題</b>へ進みます。間違えても何度でも答え直せます（ペナルティなし）。',
  '分からない問題は<b>パス</b>できます。ただし<span class="rule-red">前の問題には戻れません</span>。',
  '12問目を正解するかパスすると、時間が残っていても終了です。',
  '1問正解ごとに1点。<b>結果発表まで、自分の得点も分かりません！</b>'
]}];
function defaultSettings(){ return { answerSec:60, practiceFirst:true }; }
function defaultAppData(){ return { memo:'', ruleSlides:JSON.parse(JSON.stringify(DEFAULT_RULE_SLIDES)), settings:defaultSettings(), genres:[] }; }
function newQ(){ return { text:'', answers:'', answerLabel:'', supp:'', imgs:[] }; }
function newGenre(){ const qs=[]; for(let i=0;i<Q_PER_GENRE;i++) qs.push(newQ()); return { id:uid(), name:'', include:true, done:false, questions:qs }; }
function mergeAppData(d){
  const m=Object.assign(defaultAppData(), d||{});
  if(!Array.isArray(m.ruleSlides)||!m.ruleSlides.length) m.ruleSlides=JSON.parse(JSON.stringify(DEFAULT_RULE_SLIDES));
  m.ruleSlides.forEach(s=>{ if(!Array.isArray(s.groups)||!s.groups.length) s.groups=['']; if(s.img===undefined) s.img=null; });
  const ds=defaultSettings(); m.settings=Object.assign({}, ds, m.settings||{});
  { const v=toInt(m.settings.answerSec); m.settings.answerSec= isNaN(v)||v<1 ? ds.answerSec : v; }
  m.settings.practiceFirst=!!m.settings.practiceFirst;
  if(!Array.isArray(m.genres)) m.genres=[];
  m.genres=m.genres.map(g=>{ const x=Object.assign(newGenre(), g); x.questions=(Array.isArray(g.questions)?g.questions:[]).map(q=>{ const y=Object.assign(newQ(), q); if(!Array.isArray(y.imgs)) y.imgs=[]; return y; }); return x; });
  if(typeof m.memo!=='string') m.memo='';
  return m;
}
function openDb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(){ const db=await openDb(); return new Promise((res,rej)=>{ const rq=db.transaction(STORE,'readonly').objectStore(STORE).get(DATA_KEY); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); }
async function idbSet(v){ const db=await openDb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(v,DATA_KEY); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
let appData=defaultAppData();
async function loadAppData(){ try{ appData=mergeAppData(await idbGet()); }catch(e){ appData=defaultAppData(); } }
function ruleText(html){ const s=(gs&&gs.settings)||appData.settings; return String(html||'').replace(/\{制限秒\}/g, s.answerSec); }
function answerList(q){ return String(q.answers||'').split(/[,，、]/).map(s=>s.trim()).filter(Boolean); }
function answerLabel(q){ return String(q.answerLabel||'').trim() || answerList(q)[0] || ''; }
/** 採点用の正規化（全角半角・大小文字・ひらがな/カタカナ・空白や記号の違いを無視。小数点・カンマ・ハイフンは残す） */
function normAns(s){
  s=String(s||'').normalize('NFKC').toLowerCase();
  s=s.replace(/[ぁ-ゖ]/g, c=>String.fromCharCode(c.charCodeAt(0)+0x60));   // ひらがな→カタカナ
  return s.replace(/[\s・、。!！?？「」『』()（）\[\]【】'"`~〜:：;；\/／&＆＿_]/g,'');
}
function isCorrect(q, text){ const t=normAns(text); return !!t && answerList(q).some(a=>normAns(a)===t); }
/** 出題できる問題（問題文か画像があり、正解が登録されているもの） */
function validQs(g){ return (g&&g.questions||[]).filter(q=>(String(q.text).trim() || q.imgs.length) && answerList(q).length); }
function genreName(g){ return String(g&&g.name||'').trim() || '（ジャンル名なし）'; }

/* =========================================================
   ホスト画面
   ========================================================= */
let gs=null, peer=null, myHostId=null, tickTimer=null, audioCtx=null, beepedTimerId=null;
const conns={}, connected=new Set();

function freshState(){
  return { phase:'lobby', players:{}, order:[], gids:[], gi:0, ruleSlideIndex:0, ruleRevealIndex:0,
           settings:null, round:null, rounds:[], timer:null, resultStep:0, finalStep:0 };
}
function S(){ return gs.settings || appData.settings; }
function genRoomId(){ return ROOM_PREFIX + String(Math.floor(100000+Math.random()*900000)); }
function joinUrl(){ return myHostId ? location.origin+location.pathname+'?room='+encodeURIComponent(myHostId) : ''; }
function pname(pid){ const p=gs.players[pid]; return p?p.name:'（退出）'; }
function allPids(){ return gs.order.filter(p=>gs.players[p]); }
function connectedPids(){ return gs.order.filter(pid=>gs.players[pid] && connected.has(pid)); }
function isDummy(pid){ return !!(gs.players[pid]&&gs.players[pid].dummy); }
function gById(id){ return appData.genres.find(g=>g.id===id); }
function curG(){ return gs.round ? gById(gs.round.gid) : gById(gs.gids[gs.gi]); }
function curQs(){ return validQs(curG()); }
function isPracticeIdx(i){ return !!S().practiceFirst && i===0; }
/* ジャンルの表記：例題は数えない */
function labelFor(i){
  if(isPracticeIdx(i)) return '例題';
  const off=S().practiceFirst?1:0, n=i+1-off, real=gs.gids.length-off;
  return n===real ? `第${n}ジャンル（最終ジャンル）` : `第${n}ジャンル / 全${real}ジャンル`;
}
function totalScore(pid){ return gs.rounds.filter(r=>!r.practice).reduce((a,r)=>a+(r.pts[pid]||0),0); }
/** 得点順に並べ、同点は同順位 */
function rankBy(scoreOf){
  const list=allPids().map(pid=>({pid, name:pname(pid), score:scoreOf(pid)}));
  list.sort((a,b)=>b.score-a.score);
  list.forEach(x=>{ x.rank=1+list.filter(y=>y.score>x.score).length; });
  return list;
}
function progOf(pid, create){
  const r=gs.round; if(!r) return null;
  if(!r.prog[pid] && create) r.prog[pid]={ qi:0, ok:[], pass:[], doneAt:null };
  return r.prog[pid]||null;
}

async function initHost(){
  requestWakeLock();
  await loadAppData();
  const saved=lsGet(LS.state,null), room=lsGet(LS.room,null);
  const resumable = saved && room && !(saved.phase==='final' && saved.finalStep>=3) &&(saved.phase!=='lobby' || Object.keys(saved.players||{}).length);
  if(resumable && confirm('前回の続きから再開しますか？\n\nOK：続きから再開（同じQRのまま）\nキャンセル：新しい部屋を作る')){
    gs=Object.assign(freshState(), saved);
    // 落ちていた間は時間を進めない
    if(gs.timer && gs.heartbeatAt){ const down=Math.max(0, Date.now()-gs.heartbeatAt); gs.timer.endsAt+=down; if(gs.round && gs.round.startAt) gs.round.startAt+=down; }
    startPeer(room, 0);
  } else {
    localStorage.removeItem(LS.state); localStorage.removeItem(LS.room);
    gs=freshState();
    startPeer(null, 0);
  }
  document.getElementById('app').addEventListener('click', onHostClick);
  document.addEventListener('keydown', e=>{
    if(e.key!=='Enter' || e.isComposing || e.keyCode===229 || e.repeat) return;
    if(e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
    if(document.querySelector('#modal-root .modal-bg, .img-modal')) return;
    const b=document.querySelector('#app [data-enter]:not([disabled])');
    if(b){ e.preventDefault(); b.click(); }
  });
  tickTimer=setInterval(tickHostTimer, 200);
  renderHost();
}
function startPeer(roomId, retry){
  const id=roomId||genRoomId();
  if(peer){ try{ peer.destroy(); }catch(e){} }
  peer=new Peer(id);
  peer.on('open', pid=>{ myHostId=pid; lsSet(LS.room, pid); saveState(); renderHost(); });
  peer.on('connection', conn=>{
    conn.on('data', data=>handleSubMessage(conn, data));
    conn.on('close', ()=>{
      const pid=conn._pid;
      if(pid && conns[pid]===conn){ delete conns[pid]; connected.delete(pid); renderHost(); }
    });
  });
  peer.on('error', err=>{
    if(err && err.type==='unavailable-id'){
      if(roomId && retry<8){ setTimeout(()=>startPeer(roomId, retry+1), 2500); }
      else { showToast('部屋番号を新しくしました。スマホはQRから入り直してください', 5000); startPeer(null, 0); }
    } else { console.error(err); }
  });
  peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
}
function saveState(){ gs.heartbeatAt=Date.now(); lsSet(LS.state, gs); }
function commit(){ saveState(); syncAll(); renderHost(); }
function sendTo(pid, msg){ const c=conns[pid]; if(c && c.open){ try{ c.send(msg); return true; }catch(e){} } return false; }
function syncAll(){ Object.keys(conns).forEach(pid=>sendTo(pid, snapshotFor(pid))); }

/** 参加者に送る画面情報。得点は結果発表（総合の1位発表）まで送らない */
function snapshotFor(pid){
  const r=gs.round, ph=gs.phase, g=curG();
  const o={ type:'state', phase:ph, name:pname(pid), label:'', genre:'', practice:false, roundId:r?r.id:null };
  if(['ready','answer','answered','reveal','result'].includes(ph) && g){
    o.label=r?r.label:labelFor(gs.gi); o.genre=genreName(g); o.practice=r?!!r.practice:isPracticeIdx(gs.gi);
  }
  if(ph==='answer' && r){
    const qs=curQs(), p=progOf(pid, true);
    o.n=qs.length;
    o.timer={ id:gs.timer?gs.timer.id:'', remainMs: gs.timer?Math.max(0, gs.timer.endsAt-Date.now()):0 };
    if(p.doneAt!=null || p.qi>=qs.length) o.finished=true;
    else { const q=qs[p.qi]; o.cur={ i:p.qi, text:String(q.text||''), imgs:q.imgs||[] }; }
  }
  if(ph==='final' && gs.finalStep>=3){ const me=rankBy(totalScore).find(x=>x.pid===pid); if(me){ o.rank=me.rank; o.total=me.score; o.count=allPids().length; } }
  return o;
}
function handleSubMessage(conn, data){
  if(!data || !data.type) return;
  if(data.type==='join'){
    let pid=String(data.pid||''); const name=String(data.name||'').trim().slice(0,12);
    if(!pid) return;
    if(!name){ try{ conn.send({type:'join_rejected', reason:'empty'}); }catch(e){} return; }
    const norm=s=>String(s).normalize('NFKC').trim().toLowerCase();
    if(!gs.players[pid]){
      // タブを閉じて入り直した人：同じニックネームで切断中の人がいれば、その人として復帰
      const same=gs.order.find(p=>gs.players[p] && !gs.players[p].dummy && norm(gs.players[p].name)===norm(name));
      if(same && !connected.has(same)){
        gs.players[pid]=gs.players[same]; delete gs.players[same];
        gs.order=gs.order.map(p=>p===same?pid:p);
        const ren=obj=>{ if(obj && obj[same]!==undefined){ obj[pid]=obj[same]; delete obj[same]; } };
        if(gs.round) ren(gs.round.prog);
        gs.rounds.forEach(x=>ren(x.pts));
      } else if(gs.order.some(p=>gs.players[p] && norm(gs.players[p].name)===norm(name))){ try{ conn.send({type:'join_rejected', reason:'duplicate'}); }catch(e){} return; }
      else { gs.players[pid]={name}; gs.order.push(pid); }
    } else {
      if(gs.order.some(p=>p!==pid && gs.players[p] && norm(gs.players[p].name)===norm(name))){ try{ conn.send({type:'join_rejected', reason:'duplicate'}); }catch(e){} return; }
      gs.players[pid].name=name;
    }
    const old=conns[pid];
    conn._pid=pid; conns[pid]=conn; connected.add(pid);
    if(old && old!==conn){ try{ old.close(); }catch(e){} }
    commit();
    return;
  }
  const pid=conn._pid; if(!pid || !gs.players[pid]) return;
  const r=gs.round;
  if(data.type==='answer' || data.type==='pass'){
    if(gs.phase!=='answer' || !r || data.roundId!==r.id) return;
    if(gs.timer && Date.now()>gs.timer.endsAt+1500) return;   // 時間切れ後の送信は受け付けない
    const qs=curQs(), p=progOf(pid, true);
    if(p.doneAt!=null || toInt(data.i)!==p.qi || p.qi>=qs.length) { sendTo(pid, snapshotFor(pid)); return; }   // 古い問題への送信は無視して今の状態を送り直す
    if(data.type==='answer'){
      const text=String(data.text||'').slice(0,60);
      if(!isCorrect(qs[p.qi], text)){ sendTo(pid, {type:'judge', ok:false, text, i:p.qi}); return; }
      p.ok.push(p.qi);
      sendTo(pid, {type:'judge', ok:true, text, i:p.qi});
    } else {
      p.pass.push(p.qi);
    }
    p.qi++;
    if(p.qi>=qs.length) p.doneAt=Date.now()-r.startAt;
    saveState();
    sendTo(pid, snapshotFor(pid));   // 本人にだけ次の問題を送る（ホスト画面には進み具合を出さない）
    const real=connectedPids().filter(x=>!isDummy(x));
    if(real.length && real.every(x=>{ const pp=progOf(x); return pp && pp.doneAt!=null; })) closeAnswer();
  }
}

/* ----- 進行 ----- */
function playableGenres(){ return appData.genres.filter(g=>g.include && validQs(g).length); }
async function startGame(withRule){
  await loadAppData();
  const gl=playableGenres();
  const need=appData.settings.practiceFirst?2:1;
  if(gl.length<need){ alert(appData.settings.practiceFirst
      ? '出題できるジャンルが足りません。\n「最初のジャンルを例題にする」がオンのため、例題のほかに1ジャンル以上、問題と正解を登録して「出題する」にチェックを入れてください。'
      : '出題できるジャンルがありません。問題と正解を登録して「出題する」にチェックを入れてください。'); return; }
  if(!allPids().length && !confirm('参加者が0人です。表示確認用としてこのまま進めますか？')) return;
  gs.settings=JSON.parse(JSON.stringify(appData.settings));
  gs.gids=gl.map(g=>g.id); gs.gi=0; gs.rounds=[]; gs.round=null; gs.timer=null;
  const hasRule=appData.ruleSlides.some(s=>s.img || s.groups.some(g=>stripHtml(g)));
  if(withRule && hasRule){ gs.phase='rule'; gs.ruleSlideIndex=0; gs.ruleRevealIndex=0; }
  else gs.phase='ready';
  commit();
}
function advanceRule(){
  const slides=appData.ruleSlides, slide=slides[gs.ruleSlideIndex];
  if(gs.ruleRevealIndex < slide.groups.length-1) gs.ruleRevealIndex++;
  else if(gs.ruleSlideIndex < slides.length-1){ gs.ruleSlideIndex++; gs.ruleRevealIndex=0; }
  else gs.phase='ready';
  commit();
}
function retreatRule(){
  const slides=appData.ruleSlides;
  if(gs.ruleRevealIndex>0) gs.ruleRevealIndex--;
  else if(gs.ruleSlideIndex>0){ gs.ruleSlideIndex--; gs.ruleRevealIndex=slides[gs.ruleSlideIndex].groups.length-1; }
  commit();
}
function startAnswer(){
  if(gs.phase!=='ready') return;
  const gid=gs.gids[gs.gi];
  gs.round={ id:uid(), gid, label:labelFor(gs.gi), practice:isPracticeIdx(gs.gi), prog:{}, startAt:Date.now(), recorded:false };
  gs.phase='answer'; gs.timer={ id:gs.round.id, endsAt:Date.now()+S().answerSec*1000 };
  commit();
}
function closeAnswer(){
  if(gs.phase!=='answer') return;
  gs.phase='answered'; gs.timer=null;
  commit();
}
async function goReveal(){
  if(gs.phase!=='answered') return;
  const r=gs.round, g=curG();
  if(!r.recorded){
    const pts={};
    allPids().forEach(pid=>{ const p=r.prog[pid]; pts[pid]=p?p.ok.length:0; });
    gs.rounds.push({ id:r.id, gid:r.gid, label:r.label, genre:genreName(g), practice:r.practice, pts });
    r.recorded=true;
    if(g && !g.done){ g.done=true; try{ const d=mergeAppData(await idbGet()); const dg=d.genres.find(x=>x.id===g.id); if(dg){ dg.done=true; await idbSet(d); } }catch(e){} }
  }
  gs.phase='reveal';
  commit();
}
function goResult(){ if(gs.phase!=='reveal') return; gs.phase='result'; gs.resultStep=0; commit(); }
function nextGenre(){
  if(gs.phase!=='result') return;
  if(gs.gi>=gs.gids.length-1){ goFinal(); return; }
  gs.gi++; gs.round=null; gs.phase='ready';
  commit();
}
function goFinal(){
  gs.phase='final'; gs.round=null; gs.timer=null; gs.finalStep=0;
  commit();
}
function playAgain(){
  localStorage.removeItem(LS.state);
  gs.phase='lobby'; gs.rounds=[]; gs.round=null; gs.timer=null; gs.gi=0; gs.gids=[]; gs.settings=null; gs.finalStep=0; gs.resultStep=0;
  commit();
}

/* ----- リハーサル用ダミー ----- */
function addDummies(){
  let n=1;
  for(let k=0;k<4;k++){
    while(gs.order.some(p=>gs.players[p] && gs.players[p].name===`テスト${n}`)) n++;
    const pid='dummy-'+uid(); gs.players[pid]={name:`テスト${n}`, dummy:true}; gs.order.push(pid); n++;
  }
  commit();
}
function removeDummies(){ gs.order.filter(isDummy).forEach(p=>delete gs.players[p]); gs.order=gs.order.filter(p=>gs.players[p]); commit(); }
function dummyAnswer(){
  const r=gs.round, qs=curQs(); if(!r) return;
  gs.order.filter(isDummy).forEach((pid,k)=>{
    const p={ qi:0, ok:[], pass:[], doneAt:null };
    const reach=Math.max(1, Math.min(qs.length, Math.round(qs.length*(0.4+Math.random()*0.6))-k%2));
    for(let i=0;i<reach;i++){ (Math.random()<0.6?p.ok:p.pass).push(i); }
    p.qi=reach; if(reach>=qs.length) p.doneAt=Date.now()-r.startAt;
    r.prog[pid]=p;
  });
  showToast('ダミーが解答しました'); saveState(); renderHost();
}

/* ----- タイマー ----- */
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(off=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+off; g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      o.start(t); o.stop(t+0.3);
    });
  }catch(e){}
}
let lastBeat=0;
function tickHostTimer(){
  if(!gs || !gs.timer) return;
  const ms=gs.timer.endsAt-Date.now();
  if(Date.now()-lastBeat>1000){ lastBeat=Date.now(); saveState(); }
  const el=document.getElementById('host-timer');
  if(el){ el.innerHTML=`${Math.max(0,Math.ceil(ms/1000))}<span class="unit">秒</span>`; el.classList.toggle('zero', ms<=0); }
  if(ms<=0 && beepedTimerId!==gs.timer.id){ beepedTimerId=gs.timer.id; if(ms>-3000) beep(); }
  if(ms<=-1500 && gs.phase==='answer') closeAnswer();   // 通信の遅れを考えて少し待ってから締め切る
}

function openQrModal(){
  if(!myHostId){ showToast('部屋を準備中です'); return; }
  const m=openModal(`<h3>参加用QRコード</h3><div style="text-align:center"><div class="qrbox" id="qr-modal"></div><div class="url" style="color:#666">${esc(joinUrl())}</div></div>`);
  new QRCode(m.el.querySelector('#qr-modal'), {text:joinUrl(), width:260, height:260});
}
function kickPlayer(pid){
  if(!gs.players[pid] || !confirm(`${pname(pid)}さんを参加者から外しますか？`)) return;
  sendTo(pid, {type:'removed'});
  const c=conns[pid]; delete conns[pid]; connected.delete(pid);
  delete gs.players[pid];
  gs.order=gs.order.filter(p=>p!==pid);
  setTimeout(()=>{ try{ c&&c.close(); }catch(err){} }, 300);
  commit();
}

let hostLockAt=0;
function onHostClick(e){
  const b=e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const act=b.dataset.act;
  if(b.classList.contains('primary') || b.hasAttribute('data-enter')){
    if(Date.now()-hostLockAt<400) return;   // 主ボタンの連打防止
    hostLockAt=Date.now();
  }
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(err){}
  if(act==='qr') openQrModal();
  else if(act==='admin'){ if(gs.phase==='lobby' || confirm('管理ページを開きますか？\n（ゲームの進行状況は保存されます。戻ると「続きから再開」できます）')) location.href=location.pathname+'?mode=admin'; }
  else if(act==='newroom'){
    if(!confirm('新しい部屋を作り直しますか？\n（今の進行状況は消え、スマホはQRから入り直しになります）')) return;
    localStorage.removeItem(LS.state); localStorage.removeItem(LS.room);
    location.reload();
  }
  else if(act==='kick') kickPlayer(b.dataset.pid);
  else if(act==='dummy-add') addDummies();
  else if(act==='dummy-del') removeDummies();
  else if(act==='dummy-answer') dummyAnswer();
  else if(act==='start') startGame(true);
  else if(act==='start-norule') startGame(false);
  else if(act==='rule-next') advanceRule();
  else if(act==='rule-prev') retreatRule();
  else if(act==='rule-skip'){ gs.phase='ready'; commit(); }
  else if(act==='answer'){ b.disabled=true; startAnswer(); }
  else if(act==='close-answer'){ if(confirm('解答を締め切りますか？')) closeAnswer(); }
  else if(act==='reveal'){ b.disabled=true; goReveal(); }
  else if(act==='result') goResult();
  else if(act==='result-top'){ gs.resultStep=1; commit(); }
  else if(act==='next') nextGenre();
  else if(act==='final-next'){
    // 1:3位 → 2:2位 → 3:1位。同点で該当者のいない順位は飛ばす
    const rk=rankBy(totalScore), has=n=>rk.some(x=>x.rank===n);
    let st=gs.finalStep+1; while(st<3 && !has(4-st)) st++;
    gs.finalStep=Math.min(3, st); commit();
  }
  else if(act==='final'){ if(confirm('ここでゲームを終了して総合結果発表に進みますか？')) goFinal(); }
  else if(act==='again'){ if(confirm('同じメンバーでもう一度遊びますか？（得点はリセットされます）')) playAgain(); }
}

function hostTopbar(){
  const r=gs.round;
  const label = gs.phase==='ready' ? labelFor(gs.gi) : (r ? r.label : '');
  const inGame=!['lobby','rule','final'].includes(gs.phase);
  return `<div class="topbar">
    <span class="title">⏱ ${esc(GAME_TITLE)}</span>
    ${inGame && label ? `<span class="round-label ${label==='例題'?'practice':''}">${esc(label)}</span>` : ''}
    <span class="spacer"></span>
    ${gs.phase!=='lobby'?'<button class="small" data-act="qr">📱 QR表示</button>':''}
    <button class="small" data-act="admin">⚙ 管理ページ</button>
    ${['lobby','final'].includes(gs.phase)?'':'<button class="small ghost" data-act="newroom">🆕 新しい部屋を作り直す</button>'}
  </div>`;
}
function timerBlock(){
  const t=gs.timer; if(!t) return '';
  const ms=Math.max(0, t.endsAt-Date.now());
  return `<div class="timer ${ms<=0?'zero':''}" id="host-timer">${Math.ceil(ms/1000)}<span class="unit">秒</span></div>`;
}
function podHtml(rank, list, shown, anim){
  if(!list.length) return '';
  if(!shown) return `<div class="pod r${rank} hidden"><div class="rk">${rank}位</div><div class="nm">？？？</div><div class="sc">？点</div></div>`;
  if(!list.length) return '';
  return list.map(x=>`<div class="pod r${rank} ${anim?'pop':''}"><div class="rk">${rank}位</div><div class="nm">${esc(x.name)}${isDummy(x.pid)?'<span style="font-size:14px">（ダミー）</span>':''}</div><div class="sc">${x.score}点</div></div>`).join('');
}
function restHtml(rest){
  return rest.length ? `<div class="rest-list">${rest.map(x=>`<div class="rest-item"><span class="rk">${x.rank}位</span><span>${esc(x.name)}${isDummy(x.pid)?'<span class="muted" style="font-size:13px">（ダミー）</span>':''}</span><span class="sc">${x.score}点</span></div>`).join('')}</div>` : '';
}

let lastRenderKey='';
function renderHost(){
  const app=document.getElementById('app');
  if(!gs) return;
  const ph=gs.phase, s=S(), r=gs.round, g=curG();
  const animKey=ph+'|'+gs.resultStep+'|'+gs.finalStep+'|'+gs.gi; const anim=animKey!==lastRenderKey; lastRenderKey=animKey;
  let body='';
  if(ph==='lobby'){
    const pids=allPids();
    const n=connectedPids().length, dn=pids.filter(isDummy).length;
    const gl=playableGenres(), real=Math.max(0, gl.length-(s.practiceFirst?1:0));
    body=`<div class="card" style="text-align:center">
      <h2>スマホでQRコードを読み込んで参加してください</h2>
      <div class="lobby">
        <div>${myHostId?'<div class="qrbox" id="qr"></div>':'<div class="spinner"></div><p>部屋を準備中…</p>'}
          <div class="url">${esc(joinUrl())}</div></div>
        <div>

      </div>
    </div>`;
  }
  else if(ph==='rule'){
    const slides=appData.ruleSlides;
    const si=Math.min(gs.ruleSlideIndex, slides.length-1), slide=slides[si];
    const ri=Math.min(gs.ruleRevealIndex, slide.groups.length-1);
    const isLast = si===slides.length-1 && ri>=slide.groups.length-1;

      <div class="btnbar">
        <button data-act="rule-prev" ${si===0&&ri===0?'disabled':''}>◀ 前へ</button>
        <button class="primary big" data-act="rule-next" data-enter>${isLast?'▶ ジャンル発表へ':'次へ ▶'}</button>
        <button class="ghost small" data-act="rule-skip">ルールをとばす</button>
      </div></div>`;
  }
  else if(ph==='ready'){
    const qs=curQs();
    body=`<div class="stage">
      <div class="genre-sub">${esc(labelFor(gs.gi))} のジャンルは…</div>
      <div class="genre-big">${esc(genreName(g))}</div>
      <div class="genre-sub">全${qs.length}問／制限時間 ${s.answerSec}秒${isPracticeIdx(gs.gi)?'<br><span style="color:#c9a8ff">例題（練習）なので得点は入りません</span>':''}</div>
      <div class="btnbar"><button class="primary big" data-act="answer" data-enter>▶ ゲームスタート（${s.answerSec}秒）</button></div>
      ${gs.rounds.some(x=>!x.practice)?`<div class="btnbar"><button class="small ghost" data-act="final">🏁 ここで終了して総合結果発表</button></div>`:''}
    </div>`;
  }
  else if(ph==='answer'||ph==='answered'){
    // 解答中は誰が何問進んだか・何問正解したかをホスト画面に出さない
    const n=connectedPids().length, hasDummy=allPids().some(isDummy);
    body=`<div class="stage">
      <div class="genre-sub">ジャンル</div>
      <div class="genre-big" style="font-size:48px">${esc(genreName(g))}</div>
      ${ph==='answer' ? timerBlock() : '<div class="timer zero" style="font-size:72px">⏰ 終了！</div>'}
      <p style="font-size:22px;font-weight:800">${ph==='answer' ? `${n}人が挑戦中…` : 'このあと正解発表！'}</p>
      <div class="btnbar">
        ${ph==='answer' ? `<button class="ghost" data-act="close-answer">解答を締め切る</button>${hasDummy?'<button class="small ghost" data-act="dummy-answer">🧪 ダミーが解答する</button>':''}`
                        : '<button class="primary big" data-act="reveal" data-enter>📖 正解発表へ</button>'}
      </div>
    </div>`;
  }
  else if(ph==='reveal'){
    const qs=curQs();
    body=`<h2 style="text-align:center">${esc(r.label)}「${esc(genreName(g))}」 正解発表</h2>
      <div class="card" style="padding:6px 12px"><table class="ans-table">${qs.map((q,i)=>`<tr>
        <td class="no">${i+1}</td>
        <td>${esc(q.text)}${q.imgs.length?`<div>${q.imgs.map(u=>`<img src="${u}">`).join('')}</div>`:''}</td>
        <td class="ans"><span class="ans-pill">${esc(answerLabel(q))}</span>${q.supp?`<div class="supp">${esc(q.supp)}</div>`:''}</td></tr>`).join('')}</table></div>
      <div class="btnbar"><button class="primary big" data-act="result" data-enter>🏅 結果発表へ</button></div>`;
  }
  else if(ph==='result'){
    const x=gs.rounds[gs.rounds.length-1];
    const rk=rankBy(pid=>x.pts[pid]||0), top=rk.filter(y=>y.rank<=3), rest=rk.filter(y=>y.rank>3);
    const step=rest.length?gs.resultStep:1, isLast=gs.gi>=gs.gids.length-1;
    body=`<h2 style="text-align:center">${esc(x.label)}「${esc(x.genre)}」 結果発表</h2>
      ${x.practice?'<p class="muted" style="text-align:center">例題のため得点は加算されません。次から本番です！</p>':''}
      <div class="podium">${[2,1,3].map(n=>podHtml(n, top.filter(y=>y.rank===n), step>=1, anim)).join('')}</div>
      ${restHtml(rest)}
      ${!rk.length?'<p class="muted" style="text-align:center">参加者がいません</p>':''}
      <div class="btnbar">
        ${step<1 ? '<button class="primary big" data-act="result-top" data-enter>🏆 トップ3を発表</button>'
                 : `<button class="primary big" data-act="next" data-enter>${isLast?'🏆 総合結果発表へ':'▶ 次のジャンル発表へ'}</button>
                    ${isLast||x.practice?'':'<button class="small ghost" data-act="final">🏁 ここで終了して総合結果発表</button>'}`}
      </div>`;
  }
  else if(ph==='final'){
    const rk=rankBy(totalScore), rest=rk.filter(x=>x.rank>3), real=gs.rounds.filter(x=>!x.practice);
    const st=gs.finalStep;   // 0:4位以下 → 1:3位 → 2:2位 → 3:1位
    const has=n=>rk.some(x=>x.rank===n);
    // 同点で該当者のいない順位は飛ばす
    const nextLabel = st===0 ? (has(3)?'🥉 3位を発表':(has(2)?'🥈 2位を発表':'🥇 1位を発表')) : st===1 ? (has(2)?'🥈 2位を発表':'🥇 1位を発表') : '🥇 1位を発表';
    const shown=n=> n===3 ? st>=1 : n===2 ? st>=2 : st>=3;
    body=`<h1 style="text-align:center;font-size:40px">🏆 総合結果発表 🏆</h1>
      <div class="podium">${[2,1,3].map(n=>has(n)?podHtml(n, rk.filter(x=>x.rank===n), shown(n), anim && ((n===3&&st===1)||(n===2&&st===2)||(n===1&&st===3))):'').join('')}</div>
      ${restHtml(rest)}
      ${st<3 ? `<div class="btnbar"><button class="primary big" data-act="final-next" data-enter>${nextLabel}</button></div>` : `
        ${real.length?`<div class="card"><h3>ジャンルごとの得点</h3><div class="table-wrap"><table>
          <thead><tr><th>順位</th><th>名前</th>${real.map(x=>`<th>${esc(x.genre)}</th>`).join('')}<th>合計</th></tr></thead>
          <tbody>${rk.map(p=>`<tr><td>${p.rank}位</td><td><b>${esc(p.name)}</b></td>${real.map(x=>`<td>${x.pts[p.pid]==null?'—':x.pts[p.pid]}</td>`).join('')}<td><b style="color:var(--accent)">${p.score}点</b></td></tr>`).join('')}</tbody>
        </table></div></div>`:''}
        <div class="btnbar"><button class="primary big" data-act="again">🔁 もう一度遊ぶ（同じメンバー）</button>
          <button class="ghost" data-act="newroom">🆕 新しい部屋を作り直す</button></div>`}`;
  }
  app.innerHTML=`<div class="page">${hostTopbar()}${body}</div>`;
  const qr=document.getElementById('qr');
  if(qr && myHostId) new QRCode(qr, {text:joinUrl(), width:260, height:260});
}

/* =========================================================
   参加者画面（スマホ）
   ========================================================= */
let myPeer=null, myConn=null, myPid='', myName='', sub=null, removedByHost=false, subTimerEnds=null, lastViewKey='';
let subJudge=null, subWaiting=false;

function initSub(){
  requestWakeLock();
  myPid=sessionStorage.getItem(SS_PID) || uid();
  sessionStorage.setItem(SS_PID, myPid);
  myName=sessionStorage.getItem(SS_NAME) || '';
  renderConnecting();
  setInterval(tickSubTimer, 250);
  myPeer=new Peer();
  myPeer.on('open', ()=>connectToHost(params.get('room')));
  myPeer.on('disconnected', ()=>{ try{ myPeer.reconnect(); }catch(e){} });
  myPeer.on('error', err=>{
    console.error(err);
    if(err && err.type==='peer-unavailable' && !(myConn && myConn.open)){
      document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><div class="spinner"></div>
        <p>部屋が見つかりません。ホストの画面が開いているか、QRコードが最新か確認してください。</p><p class="muted" style="font-size:13px">自動で再接続を試みています…</p></div></div>`;
      lastViewKey='';
    }
  });
  const app=document.getElementById('app');
  app.addEventListener('click', onSubClick);
  app.addEventListener('keydown', e=>{ if(e.target.id==='ans-input' && e.key==='Enter' && !e.isComposing){ e.preventDefault(); submitAnswer(); } });
}
function connectToHost(roomId){
  let timer=null;
  const retry=()=>{ if(removedByHost) return; clearTimeout(timer); timer=setTimeout(tryConnect, 3000); };
  function tryConnect(){
    if(removedByHost) return;
    try{
      const conn=myPeer.connect(roomId, {reliable:true});
      myConn=conn;
      conn.on('open', ()=>{ if(myName) sendJoin(); else renderNameForm(''); });
      conn.on('data', handleHostMessage);
      conn.on('close', ()=>{ if(myConn===conn){ lastViewKey=''; subWaiting=false; renderConnecting(); retry(); } });
      conn.on('error', ()=>{ if(myConn===conn) retry(); });
      setTimeout(()=>{ if(myConn===conn && !conn.open){ try{ conn.close(); }catch(e){} retry(); } }, 8000);
    }catch(e){ retry(); }
  }
  tryConnect();
}
function sendHost(msg){ if(myConn && myConn.open){ try{ myConn.send(msg); return true; }catch(e){} } showToast('通信が切れています。再接続をお待ちください'); return false; }
function sendJoin(){ sendHost({type:'join', pid:myPid, name:myName}); }
function renderConnecting(){
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><div class="spinner"></div>
    <p>ホスト画面に接続しています…</p><p class="muted" style="font-size:13px">つながらない場合はそのまま少しお待ちください（自動で再接続します）</p></div></div>`;
}
function renderNameForm(err){
  lastViewKey='';
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center">
    <h2>⏱ ${esc(GAME_TITLE)}</h2>
    <p>ニックネームを入力してください</p>
    ${err?`<p style="color:var(--danger)">${esc(err)}</p>`:''}
    <input type="text" id="nick" maxlength="12" placeholder="ニックネーム（12文字まで）" value="${esc(myName)}">
    <div style="margin-top:14px"><button class="primary" id="btn-join" style="width:100%;padding:14px;font-size:17px">参加する</button></div>
    <p class="muted" style="font-size:13px">途中で画面を閉じてしまった場合は、同じニックネームで入り直すと復帰できます</p>
  </div></div>`;
  document.getElementById('btn-join').onclick=()=>{
    const v=document.getElementById('nick').value.trim();
    if(!v){ alert('ニックネームを入力してください'); return; }
    if(!confirm(`「${v}」で参加しますか？`)) return;
    myName=v; sessionStorage.setItem(SS_NAME, v);
    sendJoin();
  };
}
function handleHostMessage(data){
  if(!data) return;
  if(data.type==='state'){
    if(!sub || sub.roundId!==data.roundId || !data.cur || !sub.cur || sub.cur.i!==data.cur.i) subJudge=null;
    subWaiting=false;
    sub=data;
    subTimerEnds = data.timer ? Date.now()+data.timer.remainMs : null;   // 端末の時計に頼らない
    renderSub();
  } else if(data.type==='judge'){
    subWaiting=false;
    if(data.ok){ showToast('⭕ 正解！', 900); return; }
    subJudge={ok:false, text:data.text};
    const j=document.getElementById('judge');
    if(j){ j.className='judge ng'; j.textContent=`✕「${data.text}」は不正解… もう一度！`; }
    const box=document.getElementById('ans-area'); if(box){ box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
    const inp=document.getElementById('ans-input'); if(inp){ inp.value=''; inp.focus(); }
  } else if(data.type==='join_rejected'){
    myName=''; sessionStorage.removeItem(SS_NAME);
    renderNameForm(data.reason==='empty'?'ニックネームを入力してください':'そのニックネームは使われています。別のニックネームにしてください');
  } else if(data.type==='removed'){
    removedByHost=true; sessionStorage.removeItem(SS_NAME); sessionStorage.removeItem(SS_PID);
    document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><h2>参加者から外れました</h2><p>もう一度参加する場合はQRコードを読み直してください。</p></div></div>`;
  }
}
function timeIsUp(){ return subTimerEnds!=null && subTimerEnds<=Date.now(); }
function tickSubTimer(){
  const el=document.getElementById('sub-timer'); if(!el || subTimerEnds==null) return;
  const ms=Math.max(0, subTimerEnds-Date.now());
  el.textContent = ms<=0 ? '⏰ 時間終了' : `残り ${Math.ceil(ms/1000)}秒`;
  el.classList.toggle('zero', ms<=0);
  el.classList.toggle('warn', ms>0 && ms<=10000);
  if(ms<=0){ const inp=document.getElementById('ans-input'); if(inp && !inp.disabled){ inp.disabled=true; document.querySelectorAll('[data-sact]').forEach(b=>b.disabled=true); } }
}
function onSubClick(e){
  const b=e.target.closest('[data-sact]'); if(!b || b.disabled) return;
  const act=b.dataset.sact;
  if(act==='answer') submitAnswer();
  else if(act==='pass'){
    if(!sub || sub.phase!=='answer' || !sub.cur || subWaiting || timeIsUp()) return;
    const last=sub.cur.i>=sub.n-1;
    if(!confirm(last ? 'この問題をパスしますか？\n最後の問題なので、パスするとこのジャンルは終了です。' : 'この問題をパスしますか？\n（前の問題には戻れません）')) return;
    if(sendHost({type:'pass', i:sub.cur.i, roundId:sub.roundId})) subWaiting=true;
  }
}
function submitAnswer(){
  const inp=document.getElementById('ans-input'); if(!inp || inp.disabled || !sub || !sub.cur) return;
  if(subWaiting || timeIsUp()) return;
  const v=inp.value.trim();
  if(!v){ inp.focus(); return; }
  if(sendHost({type:'answer', text:v, i:sub.cur.i, roundId:sub.roundId})){
    subWaiting=true;
    const j=document.getElementById('judge'); if(j){ j.className='judge'; j.textContent='判定中…'; }
  }
}
function renderSub(){
  const s=sub; if(!s) return;
  // 入力中の文字が消えないよう、画面の中身が変わる時だけ描き直す
  const viewKey=JSON.stringify([s.phase,s.roundId,s.label,s.genre,s.name,s.finished,s.cur&&s.cur.i,s.rank]);
  if(viewKey===lastViewKey){ tickSubTimer(); return; }
  const sameQ = lastViewKey && JSON.parse(lastViewKey)[6]===(s.cur&&s.cur.i) && JSON.parse(lastViewKey)[1]===s.roundId;
  lastViewKey=viewKey;
  const app=document.getElementById('app');
  const head=`<div class="sub-head"><div>${esc(s.name)} さん</div><div>${s.label?esc(s.label):''}</div></div>`;
  let html='';
  if(s.phase==='answer'){
    if(s.finished){
      html=`<div class="p-center"><h2>🏁 全問終了！</h2><p style="font-size:18px">おつかれさまでした。<br>ホストの画面を見てください</p></div>`;
    } else {
      const c=s.cur;
      html=`<div class="p-timer" id="sub-timer"></div>
        <div class="p-qno">ジャンル「${esc(s.genre)}」<br><b>${c.i+1}</b> / ${s.n}問目${s.practice?'（例題）':''}</div>
        ${c.text?`<div class="p-qtext">${esc(c.text)}</div>`:''}
        ${c.imgs&&c.imgs.length?`<div class="q-imgs">${c.imgs.map(u=>`<img src="${u}">`).join('')}</div>`:''}
        <div id="ans-area"><input type="text" id="ans-input" placeholder="答えを入力" autocomplete="off" autocapitalize="off" enterkeyhint="send" style="font-size:20px;padding:12px">
        <div class="sub-btns"><button class="primary send" data-sact="answer">送信</button><button class="ghost pass" data-sact="pass">パス ▶</button></div></div>
        <div class="judge ${subJudge&&!subJudge.ok?'ng':''}" id="judge">${subJudge&&!subJudge.ok?`✕「${esc(subJudge.text)}」は不正解… もう一度！`:''}</div>
        <p class="muted" style="font-size:13px;text-align:center">間違えても何回でも答えられます（ペナルティなし）。<br>パスすると次の問題へ進みます（戻れません）。</p>`;
    }
  }
  else if(s.phase==='answered'){
    html=`<div class="p-center"><div class="p-big" style="font-size:40px;color:var(--danger)">⏰ 終了！</div><p>ホストの画面を見てください</p></div>`;
  }
  else if(s.phase==='reveal' || s.phase==='result'){
    html=`<div class="p-center"><h2>${s.phase==='reveal'?'📖 正解発表':'🏅 結果発表'}</h2><p style="font-size:18px">ホストの画面を見てください</p></div>`;
  }
  else if(s.phase==='final'){
    html=`<div class="p-center"><h2>🏆 総合結果発表</h2>${s.rank?`<div class="p-big">${s.rank}位</div><p style="font-size:20px">${s.total}点（${s.count}人中）</p>`:''}<p>ホストの画面を見てください</p></div>`;
  }
  else if(s.phase==='ready'){
    html=`<div class="p-center"><div class="muted">${esc(s.label||'')}</div><h2 style="font-size:30px;color:var(--accent)">${esc(s.genre)}</h2><p style="font-size:20px">まもなくスタート！</p><p>ホストの画面を見てください</p>
      ${s.practice?'<p class="muted">例題（練習）です。得点は入りません</p>':''}</div>`;
  }
  else {
    html=`<div class="p-center"><h2>${esc(s.name)} さん、ようこそ！</h2><p style="font-size:18px">ホストの画面を見てください</p>
      <p class="muted" style="font-size:14px">スタートすると、このスマホに問題が出ます。正解すると次の問題へ進みます</p></div>`;
  }
  const oldInp=document.getElementById('ans-input'), keep=sameQ&&oldInp?oldInp.value:'', hadFocus=oldInp && document.activeElement===oldInp;
  app.innerHTML=`<div class="page">${head}${html}</div>`;
  const inp=document.getElementById('ans-input');
  if(inp){ inp.value=keep; if(hadFocus || (s.cur && s.cur.i>0)) inp.focus(); }
  tickSubTimer();
}

/* ---- CSV一括登録 ---- */
const CSV_HEAD=['ジャンル','問題文','正解','正解表記','補足'];
function csvCell(v){ v=String(v==null?'':v); return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadText(text, name, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function toCsv(rows){ return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n'; }   // BOM付きでExcelでも文字化けしない
function ymd(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function downloadCsvTemplate(){

    ['日本の都道府県','県庁所在地が「那覇市」の都道府県は？','沖縄県,沖縄,おきなわ','沖縄県',''],

    ['動物','「百獣の王」と呼ばれる動物は？','ライオン,らいおん','ライオン','']];
  downloadText(toCsv(rows), 'tantimeattack_template.csv', 'text/csv');

  downloadText(toCsv(rows), `tantimeattack_${ymd()}.csv`, 'text/csv');

/** CSVを行×列の配列に（"…" の中のカンマ・改行・"" に対応） */
function parseCsv(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===',') { row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()));
}
/** UTF-8で読めなければShift_JIS（Excelの「CSV」保存）として読む */
function decodeCsv(buf){
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,''); }
  catch(e){ return new TextDecoder('shift_jis').decode(buf); }
}
async function onCsvFile(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  let rows;
  try{ rows=parseCsv(decodeCsv(await f.arrayBuffer())); }catch(err){ alert('CSVを読み込めませんでした'); return; }
  if(rows.length && /ジャンル/.test(rows[0][0]||'') && /問題/.test(rows[0][1]||'')) rows.shift();   // 見出し行
  const map=new Map(), skipped=[];
  rows.forEach((r,i)=>{
    const name=(r[0]||'').trim();
    const q=Object.assign(newQ(), { text:(r[1]||'').trim(), answers:(r[2]||'').trim(), answerLabel:(r[3]||'').trim(), supp:(r[4]||'').trim() });
    if(!name || !q.text || !answerList(q).length){ skipped.push(`${i+2}行目`); return; }
    if(!map.has(name)) map.set(name, []);
    map.get(name).push(q);
  });
  if(!map.size){ alert('登録できる行がありませんでした。\nジャンル・問題文・正解が入っているか確認してください。'); return; }
  const newGs=[...map].map(([name,qs])=>Object.assign(newGenre(), {name, questions:qs}));
  const odd=newGs.filter(g=>g.questions.length!==Q_PER_GENRE).map(g=>`「${g.name}」${g.questions.length}問`);
  const msg=`${newGs.length}ジャンル（${newGs.reduce((a,g)=>a+g.questions.length,0)}問）を読み込みました。`
    + (odd.length?`\n\n※12問ではないジャンル：${odd.join('、')}`:'')
    + (skipped.length?`\n\n※ジャンル・問題文・正解のどれかが空のため飛ばした行：${skipped.join('、')}`:'');
  const apply=mode=>{
    if(mode==='replace') appData.genres=newGs;
    else {
      const keep=appData.genres.filter(g=>g.name.trim() || g.questions.some(q=>q.text||q.answers));
      newGs.forEach(ng=>{ const ex=keep.find(g=>g.name.trim()===ng.name); if(ex) ex.questions=ng.questions; else keep.push(ng); });
      appData.genres=keep;
    }
    renderGenres(); showToast(`CSVを${mode==='replace'?'置き換え':'追加'}で読み込みました（保存ボタンで保存）`, 3500);
  };
  const hasG=appData.genres.some(g=>g.name.trim() || g.questions.some(q=>q.text||q.answers));
  if(!hasG){ apply('replace'); if(odd.length||skipped.length) alert(msg); return; }
  openModal(`<h3>CSVの読み込み</h3><p style="white-space:pre-wrap">${esc(msg)}\n\n今あるジャンル（${appData.genres.length}ジャンル）はどうしますか？\n「追加」の場合、同じ名前のジャンルはCSVの問題で上書きします（画像は消えます）。</p>`,
    [{label:'キャンセル'}, {label:'追加する', onClick:()=>apply('add')}, {label:'全部置き換える', cls:'danger', onClick:()=>{ if(!confirm('今あるジャンルと問題をすべて消して、CSVの内容に置き換えますか？')) return false; apply('replace'); }}]);
}

async function saveAdmin(go){
  const errors=collectAdmin();
  if(errors.length){ alert('設定を確認してください\n\n・'+errors.join('\n・')); return; }
  const warn=[];
  appData.genres.forEach(g=>{
    if(!g.include) return;
    g.questions.forEach((q,qi)=>{ const has=String(q.text).trim()||q.imgs.length, ans=answerList(q).length; if((has&&!ans)||(!has&&ans)) warn.push(`${genreName(g)} ${qi+1}問目：${has?'正解':'問題文'}が未登録`); });
  });
  if(warn.length && !confirm('次の問題は出題されません。このまま保存しますか？\n\n'+warn.slice(0,20).join('\n')+(warn.length>20?`\n…ほか${warn.length-20}件`:''))) return;
  const ov=document.getElementById('save-overlay'), bar=document.getElementById('save-bar'), pct=document.getElementById('save-pct'), msg=document.getElementById('save-msg');
  const prog=(p,m)=>{ bar.style.width=p+'%'; pct.textContent=Math.round(p)+'%'; if(m) msg.textContent=m; };
  ov.classList.add('active'); prog(10,'保存中…');
  try{
    const big=appData.ruleSlides.filter(sl=>sl.img && sl.img.length>600000);
    for(let i=0;i<big.length;i++){ big[i].img=await compressDataUrl(big[i].img); prog(10+70*(i+1)/big.length); }
    prog(85,'保存中…');
    await idbSet(appData);
    prog(100,'保存しました');
    await sleep(400);
  }catch(err){ alert('保存に失敗しました'); ov.classList.remove('active'); return; }
  ov.classList.remove('active');
  renderGenres();
  if(go) location.href=location.pathname; else showToast('保存しました');
}
function compressDataUrl(src, maxDim, quality){
  maxDim=maxDim||1000; quality=quality||0.8;
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} } else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=reject; img.src=src;
  });
}
function compressImageFile(file){ return readFileUrl(file).then(u=>compressDataUrl(u, 900, 0.8)); }

function onAdminClick(e){
  const qb=e.target.closest('[data-qact]');
  if(qb && !qb.disabled){
    const {g,qi,q}=qOf(qb), qs=g.questions, act=qb.dataset.qact;
    if(act==='img-del'){ q.imgs.splice(Number(qb.dataset.ii),1); renderGenres(); }
    else if(act==='q-up'){ [qs[qi-1],qs[qi]]=[qs[qi],qs[qi-1]]; renderGenres(); }
    else if(act==='q-down'){ if(qi<qs.length-1){ [qs[qi+1],qs[qi]]=[qs[qi],qs[qi+1]]; renderGenres(); } }
    else if(act==='q-del'){ if(confirm(`${qi+1}問目を削除しますか？（下の問題が1つずつ上に詰まります）`)){ qs.splice(qi,1); renderGenres(); } }
    return;
  }
  const gb=e.target.closest('[data-gact]');
  if(gb && !gb.disabled){
    if(e.target.closest('.hchk') || e.target.closest('.g-drag')) return;
    const blk=gb.closest('.g-block'), i=Number(blk.dataset.gi), gl=appData.genres, g=gl[i], act=gb.dataset.gact;
    if(act==='toggle'){ if(openG.has(g.id)) openG.delete(g.id); else openG.add(g.id); blk.querySelector('.g-body').classList.toggle('open'); blk.querySelector('.g-head>.muted').textContent=openG.has(g.id)?'▲':'▼'; return; }
    e.stopPropagation();
    if(act==='up'){ [gl[i-1],gl[i]]=[gl[i],gl[i-1]]; renderGenres(); }
    else if(act==='down'){ [gl[i+1],gl[i]]=[gl[i],gl[i+1]]; renderGenres(); }
    else if(act==='q-add'){ g.questions.push(newQ()); renderGenres(); }
    else if(act==='del'){ if(confirm(`ジャンル「${genreName(g)}」を削除しますか？`)){ gl.splice(i,1); renderGenres(); } }
    return;
  }
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act=b.dataset.act;
  if(act==='tohost') location.href=location.pathname;
  else if(act==='save') saveAdmin(false);
  else if(act==='save-go') saveAdmin(true);
  else if(act==='g-add'){ const g=newGenre(); appData.genres.push(g); openG.add(g.id); renderGenres(); }
  else if(act==='export'){
    collectAdmin();
    const data={app:'tantimeattack', version:1, exportedAt:new Date().toISOString(), appData};
    downloadText(JSON.stringify(data), `tantimeattack_${ymd()}.json`, 'application/json');
  }
  else if(act==='import') document.getElementById('import-file').click();
  else if(act==='csv-template') downloadCsvTemplate();
  else if(act==='csv-export') exportCsv();
  else if(act==='csv-import') document.getElementById('csv-file').click();
}
function onImportFile(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.app!=='tantimeattack' || !d.appData) throw new Error('format');
      if(!confirm('読み込んだデータで、今のデータ（メモ・設定・ルール説明・ジャンルと問題）を上書きしますか？')) return;
      await idbSet(mergeAppData(d.appData));
      alert('読み込みました'); location.reload();
    }catch(err){ alert('このファイルは読み込めませんでした'); }
  };
  rd.readAsText(f);
  e.target.value='';
}

        <div class="rule-group-block" data-gi="${gi}">
          <div class="rich-toolbar">
            <span class="muted" style="font-size:12px;margin-right:4px">段${gi+1}</span>
            <button type="button" data-ract="fmt" data-cmd="bold">太字</button>
            <button type="button" data-ract="fmt" data-cmd="colorclass" data-val="rule-red">赤字</button>
            <button type="button" data-ract="fmt" data-cmd="colorclass" data-val="rule-normal">黒字</button>
            <button type="button" data-ract="fmt" data-cmd="upsize">文字を大きく</button>
            <button type="button" data-ract="fmt" data-cmd="removeFormat">標準サイズに戻す</button>
            <span class="spacer"></span>
            <button type="button" class="ghost" data-ract="group-up" ${gi===0?'disabled':''}>▲段</button>
            <button type="button" class="ghost" data-ract="group-down" ${gi===slide.groups.length-1?'disabled':''}>▼段</button>
            <button type="button" class="ghost" data-ract="group-ins-above">⤒上に段を挿入</button>
            <button type="button" class="ghost" data-ract="group-ins-below">⤓下に段を挿入</button>
            <button type="button" class="ghost" data-ract="group-del" ${slide.groups.length<=1?'disabled':''}>🗑段</button>
          </div>
          <div class="rule-edit rule-group-edit" contenteditable="true">${g||''}</div>
        </div>`).join('')}
      <button type="button" class="small" data-ract="group-add">＋ 段を追加</button>
    </div>`).join('') + `<button type="button" class="small" data-ract="slide-add">＋ ページを追加</button>`;
}
function attachRuleSlidesEvents(){
  const container=document.getElementById('rule-editor');
  container.addEventListener('mousedown', e=>{ if(e.target.closest('.rich-toolbar')) e.preventDefault(); });
  container.addEventListener('click', e=>{
    const btn=e.target.closest('[data-ract]'); if(!btn || btn.disabled) return;
    const act=btn.dataset.ract;
    if(act==='slide-add'){ appData.ruleSlides.push({img:null, groups:['']}); renderRuleSlidesEditor(); return; }
    const slideCard=btn.closest('.rule-slide-card'); if(!slideCard) return;
    const si=Number(slideCard.dataset.si), slides=appData.ruleSlides, slide=slides[si];
    const groupBlock=btn.closest('.rule-group-block'), gi=groupBlock?Number(groupBlock.dataset.gi):null;
    if(act==='slide-up'){ [slides[si-1],slides[si]]=[slides[si],slides[si-1]]; renderRuleSlidesEditor(); }
    else if(act==='slide-down'){ [slides[si+1],slides[si]]=[slides[si],slides[si+1]]; renderRuleSlidesEditor(); }
    else if(act==='slide-del'){ if(confirm('このページを削除しますか？')){ slides.splice(si,1); renderRuleSlidesEditor(); } }
    else if(act==='slide-img-remove'){ slide.img=null; renderRuleSlidesEditor(); }
    else if(act==='group-add'){ slide.groups.push(''); renderRuleSlidesEditor(); }
    else if(act==='group-up'){ [slide.groups[gi-1],slide.groups[gi]]=[slide.groups[gi],slide.groups[gi-1]]; renderRuleSlidesEditor(); }
    else if(act==='group-down'){ [slide.groups[gi+1],slide.groups[gi]]=[slide.groups[gi],slide.groups[gi+1]]; renderRuleSlidesEditor(); }
    else if(act==='group-del'){ slide.groups.splice(gi,1); renderRuleSlidesEditor(); }
    else if(act==='group-ins-above'||act==='group-ins-below'){
      const at = act==='group-ins-above' ? gi : gi+1;
      slide.groups.splice(at,0,''); renderRuleSlidesEditor();
      const el=document.querySelectorAll(`#rule-editor .rule-slide-card[data-si="${si}"] .rule-group-edit`)[at];
      if(el) el.focus();
    }
    else if(act==='fmt'){
      const editEl=groupBlock.querySelector('.rule-group-edit');
      editEl.focus();
      const cmd=btn.dataset.cmd;
      if(cmd==='upsize') wrapSelectionBig();
      else if(cmd==='colorclass') wrapSelectionClass(btn.dataset.val);
      else document.execCommand(cmd, false, null);
      slide.groups[gi]=editEl.innerHTML;
    }
  });
  container.addEventListener('paste', e=>{
    if(!e.target.closest('.rule-group-edit')) return;
    e.preventDefault();
    const text=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  container.addEventListener('input', e=>{
    const editEl=e.target.closest('.rule-group-edit'); if(!editEl) return;
    appData.ruleSlides[Number(editEl.closest('.rule-slide-card').dataset.si)].groups[Number(editEl.closest('.rule-group-block').dataset.gi)]=editEl.innerHTML;
  });
  container.addEventListener('change', async e=>{
    if(e.target.dataset.ract!=='slide-img-input') return;
    const si=Number(e.target.closest('.rule-slide-card').dataset.si), f=e.target.files[0]; if(!f) return;
    appData.ruleSlides[si].img=await compressImageFile(f);
    renderRuleSlidesEditor();
  });
}
function wrapSelectionBig(){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); if(range.collapsed) return;
  const span=document.createElement('span'); span.style.fontSize='1.5em';
  span.appendChild(range.extractContents()); range.insertNode(span);
  const parent=span.parentNode;
  if(parent && parent.classList && (parent.classList.contains('rule-red')||parent.classList.contains('rule-normal'))){
    span.classList.add(parent.classList.contains('rule-red')?'rule-red':'rule-normal');
    const others=Array.from(parent.childNodes).filter(n=>n!==span && !(n.nodeType===3 && n.textContent===''));
    if(!others.length && parent.parentNode){ parent.parentNode.insertBefore(span, parent); parent.parentNode.removeChild(parent); }
  }
}
function wrapSelectionClass(cls){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); if(range.collapsed) return;
  const frag=range.extractContents();
  const strip=node=>{ if(node.nodeType===1){ if(node.classList){ node.classList.remove('rule-red','rule-normal'); if(!node.classList.length) node.removeAttribute('class'); } Array.from(node.childNodes).forEach(strip); } };
  Array.from(frag.childNodes).forEach(strip);
  const span=document.createElement('span'); span.className=cls;
  span.appendChild(frag); range.insertNode(span);
  let node=span;
  while(node.parentNode && node.parentNode.classList && (node.parentNode.classList.contains('rule-red')||node.parentNode.classList.contains('rule-normal'))){
    const parent=node.parentNode;
    if(Array.from(parent.childNodes).some(n=>n!==node && !(n.nodeType===3 && n.textContent===''))) break;
    const gp=parent.parentNode; if(!gp) break;
    gp.insertBefore(node, parent); gp.removeChild(parent);
  }
}

/* ---------- 起動 ---------- */
if(MODE==='admin') initAdmin();
else if(MODE==='sub') initSub();
else initHost();
</script>
